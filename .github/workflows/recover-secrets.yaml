
name: recover-secrets

on:
  workflow_dispatch:

jobs:
  gpg-encrypt:
    runs-on: ubuntu-latest
    steps:
    - env:
        GPG_KEYID: ${{ secrets.GPG_KEYID }}
        HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
        HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
        VAGRANT_USER: ${{ secrets.VAGRANT_USER }}
        VAGRANT_ACCESS_TOKEN: ${{ secrets.VAGRANT_ACCESS_TOKEN }}
      run: |
        GPG_KEYID="${{ env.GPG_KEYID }}"
        mygpg(){ gpg --no-tty --batch --trust-model always "$@" }
        mygpg --recv-key "$GPG_KEYID"
        echo "GPG_KEYID: $GPG_KEYID"|mygpg --recipient "$GPG_KEYID" --armor --encrypt
